# Render blueprint for the public host: New > Blueprint, pick this repository.
# One service serves the demo, Airwallex's create_checkout (/acp), the catalogue
# pages (/p, /img) and the TAP door (see src/countersign/web/host.py).
# Free plan; it sleeps after about 15 idle minutes, and the house keeps open checkout
# sessions in memory, so a sleep forgets them. Keep it awake with an external monitor
# on /healthz every 5 minutes (UptimeRobot); .github/workflows/keep-warm.yml is the backup.
# Every value below is set by hand in the dashboard (sync: false), never in git.
services:
  - type: web
    name: countersign-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # The service's own https URL, e.g. https://countersign-demo.onrender.com
      - key: COUNTERSIGN_PUBLIC_URL
        sync: false
      # The HMAC secret given to Airwallex at onboarding; mounts /acp when set.
      - key: COUNTERSIGN_ACP_HMAC_SECRET
        sync: false
      # base64 of 32 random bytes, so receipts still verify after a restart.
      - key: COUNTERSIGN_MERCHANT_SIGNING_KEY
        sync: false
      # Sandbox keys: real rate locks for the house merchant once set.
      - key: AIRWALLEX_CLIENT_ID
        sync: false
      - key: AIRWALLEX_API_KEY
        sync: false
      # Verifies /webhooks/airwallex (point the sandbox's payment_intent.* webhook there).
      - key: AIRWALLEX_WEBHOOK_SECRET
        sync: false
      # fake (default, pays instantly) or airwallex (real intents and Drop-in, V5′).
      - key: COUNTERSIGN_MERCHANT
        sync: false
      # 1 once U1 is live: complete waits for the shopper's passkey on /approve/<id>.
      - key: COUNTERSIGN_REQUIRE_SHOPPER_SIGNATURE
        sync: false
      # Serves our fallback merchant MCP at /acp/mcp (32+ characters). Needs the HMAC secret above.
      - key: COUNTERSIGN_MCP_TOKEN
        sync: false
      # The merchant console (/console#t=<token>) and the lever route, POST /api/levers/* (32+ characters).
      # Must differ from the MCP token and the HMAC secret.
      - key: COUNTERSIGN_LEVER_TOKEN
        sync: false
      # 1: a lever also upserts the changed product to Airwallex's catalogue (needs the Airwallex keys).
      - key: COUNTERSIGN_SYNC_CATALOG
        sync: false
      # The OAuth server's ES256 key (C14), from `python -m countersign.web.oauth`, so Claude's
      # sign-in and its tokens survive a restart.
      - key: COUNTERSIGN_OAUTH_SIGNING_KEY
        sync: false
      # The host pings its own /healthz every 5 minutes, so the free plan never sleeps (web/host.py keep_awake).
      - key: COUNTERSIGN_KEEP_AWAKE
        value: "1"
      # The demo agent stays the free scripted stand-in even if a key is set. Change this here
      # (not in the dashboard) only once the Anthropic spend cap is on, then set the key.
      - key: COUNTERSIGN_MODEL
        value: scripted
      # Leave unset until Aeshvarya says otherwise: without it the demo agent is scripted and free.
      - key: ANTHROPIC_API_KEY
        sync: false

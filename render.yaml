# Render blueprint for the hosted demo: New > Blueprint, pick this repository.
# Free plan; it sleeps when idle, and .github/workflows/keep-warm.yml wakes it.
# Set ANTHROPIC_API_KEY in the service's environment to run Claude as the agent.
services:
  - type: web
    name: countersign-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false

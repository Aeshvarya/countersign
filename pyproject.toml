[project]
name = "countersign"
version = "0.1.0"
description = "A merchant checkout that countersigns a verified agent and the shopper's approved terms before any money moves."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
]

[project.optional-dependencies]
agent = ["anthropic>=0.69"]
server = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27"]
dev = ["anthropic>=0.69", "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27"]
screens = ["playwright>=1.48"]  # scripts/screens.py, with the Chrome already installed

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countersign"]
